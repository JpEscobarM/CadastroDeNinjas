<!
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tabela de Ninjas</title>
</head>
<body>

<h1>Lista de Ninjas</h1>
<table>
    <thead>
        <tr>
            <th>IMG</th>
            <th>ID</th>
            <th>NOME</th>
            <th>IDADE</th>
            <th>EMAIL</th>
            <th>RANKING</th>
            <th>MISSOES</th>
            <tbody>
            <tr th:each = "ninja: ${ninjas}">
                <td> <img th:src="${ninja.imgUrl}" width="100" height="100"></td>
                <td th:text="${ninja.id}"></td>
                <td th:text="${ninja.nome}"></td>
                <td th:text="${ninja.idade}"></td>
                <td th:text="${ninja.email}"></td>
                <td th:text="${ninja.ranking}"></td>
                <td>
                    <span th:if="${ninja.missao}"><span th:text="${ninja.missao.nome}"></span>, Dificuldade: <span th:text="${ninja.missao.dificuldade}"></span></span>
                    <span th:if="${ninja.missao == null}">Sem Missões cadastradas para o ninja</span>
                </td>
                <td>
                    <a th:action="@{}">Ver Detalhes</a>
                    <a th:action="@{}">Alterar</a>
                    <form th:action="@{/api/ninja/ui/deletar/{id}(id=${ninja.id})}" method="post" style="display:inline;">
                    <button type="submit">Deletar</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </tr>
    </thead>
</table>

</body>
</html>
